name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Rust engine: fully gated — format, clippy (warnings = errors), and the
  # conformance suite (lexi-core/tests/conformance.rs), which runs the SAME
  # fixtures as Python to prove behavioral parity.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-core -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-core --all-targets -- -D warnings
      - name: Test (conformance parity)
        run: cargo test -p lexi-core

  # Python wheel (lexi-python, PyO3): the lexi-core engine + lexi-host runtime.
  # Build the wheel, run the SAME conformance fixtures from it, and drive the
  # runtime against an in-process mock provider. fmt + clippy gate the crate.
  wheel:
    name: wheel ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # Lower bound of the abi3-py39 wheel. Pinned: ubuntu-latest (26.04)
          # no longer ships 3.9 (EOL Oct 2025).
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-python -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-python -- -D warnings
      - name: Build & install the wheel
        run: pip install ./lexi-python pytest pyyaml
      - name: Conformance + runtime tests (from the wheel)
        run: python -m pytest lexi-python/tests -q

  # Host runtime: the I/O layer (HTTP/auth/config) over lexi-core, plus the thin
  # Rust CLI. Tests drive the compose -> POST -> extract pipeline against a mock
  # HTTP server (wiremock) — no live provider calls.
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Also test saved keys against the OS store: a throw-away keychain on
      # macOS, Credential Manager on Windows, gnome-keyring on Linux.
      LEXI_TEST_KEY_STORE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-host -p lexi-cli-rs -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-host -p lexi-cli-rs --all-targets -- -D warnings
      - name: Install a keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus
      - name: Test (mock-server pipeline)
        if: runner.os != 'Linux'
        run: cargo test -p lexi-host
      - name: Test CLI (binary end-to-end + surface matrix)
        if: runner.os != 'Linux'
        run: cargo test -p lexi-cli-rs
      # Linux: a private D-Bus session with gnome-keyring's login keyring
      # created and unlocked, as a desktop session has.
      - name: Test host and CLI, with a keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -ec '
            echo -n lexi-test | gnome-keyring-daemon --daemonize --unlock --components=secrets > /dev/null
            cargo test -p lexi-host
            cargo test -p lexi-cli-rs'

  # Desktop app (Tauri over lexi-host). macOS only for now: WKWebView is a system
  # framework there, so no extra deps. Linux (webkit2gtk) / Windows (WebView2)
  # Tauri builds + installers are a later slice. Compile-level gate only — a GUI
  # can't be visually verified in CI.
  desktop:
    name: desktop (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-desktop -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-desktop --all-targets -- -D warnings
      - name: Build
        run: cargo build -p lexi-desktop
