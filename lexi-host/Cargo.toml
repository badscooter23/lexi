[package]
name = "lexi-host"
version = "0.0.0"
edition = "2021"
description = "Runtime (I/O layer) for Lexi: HTTP transport, config/key loading, and auth over the pure lexi-core engine."
license = "MIT"
publish = false

[dependencies]
lexi-core = { path = "../lexi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
base64 = "0.22"
thiserror = "1"
dirs = "5"

# The OS key store for saved keys (docs/key-storage-design.md §4.3). macOS
# uses Apple's `security` tool instead (no crate); Linux talks to the Secret
# Service over D-Bus in pure Rust (no libdbus).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
