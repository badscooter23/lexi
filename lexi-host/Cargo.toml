[package]
name = "lexi-host"
version = "0.0.0"
edition = "2021"
description = "Runtime (I/O layer) for Lexi: HTTP transport, config/key loading, and auth over the pure lexi-core engine."
license = "MIT"
publish = false

[dependencies]
lexi-core = { path = "../lexi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
base64 = "0.22"
thiserror = "1"
dirs = "5"

# Saved API keys go in the OS credential store (src/keystore.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain: one item holding every key, and attribute-only checks
# that never read a secret (so macOS doesn't ask for access).
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
