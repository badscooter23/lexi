# Shipped template for Anthropic (see openai.yaml for how templates merge).
# Every Claude model speaks the Messages API and returns text; the /models
# listing carries real capability data (see `catalog:` below).
url: https://api.anthropic.com/v1
api_key: ${ANTHROPIC_API_KEY}

# Errors that mean the key's account can't pay (Lexi says so plainly, and
# marks the key "No credit"): `match` is part of the error body.
billing_errors:
  - match: credit balance is too low
    message: "the account for this key has no credit left. Add credit in Anthropic's Plans & Billing (https://console.anthropic.com/settings/billing), or use another key"

apis:
  - api: messages
    default_model: claude-sonnet-5-5

tag_rules:
  "claude-*": [feature:tools]

# The model listing carries per-model capabilities, limits and lifecycle
# (field paths checked against the live API, 2026-11-16); each rule maps a
# field to a tag (true adds it, false removes it, a missing field is ignored).
catalog:
  path: /models
  fields: [id, display_name, max_input_tokens, max_tokens]
  paginate: { limit_param: limit, limit: 1000, after_param: after_id, has_more: has_more, last_id: last_id }
  tags:
    in:image: { path: capabilities.image_input.supported }
    in:document: { path: capabilities.pdf_input.supported }
    feature:thinking: { path: capabilities.thinking.supported }
    feature:structured-output: { path: capabilities.structured_outputs.supported }
    feature:web-search: { path: capabilities.server_tools.web_search.supported }
    status:deprecated: { path: deprecated_at, present: true }
  limits:
    context_window: { path: max_input_tokens }
    max_output_tokens: { path: max_tokens }
  name: { path: display_name }

# Getting a key (the desktop app's setup wizard shows this).
setup:
  name: Anthropic
  about: Claude chat models.
  site: https://platform.claude.com
  keys_url: https://platform.claude.com/settings/keys
  key_prefix: sk-ant-
  steps:
    - Sign in to the Claude Console, or create an account.
    - API use is billed separately from a Claude subscription — add credits under Settings → Billing.
    - Open Settings → API keys and choose Create Key.
    - Copy the key straight away — the Console shows it only once.
