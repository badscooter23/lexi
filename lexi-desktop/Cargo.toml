[package]
name = "lexi-desktop"
version = "0.3.0"
edition = "2021"
description = "Lexi desktop app (Tauri) — a thin webview shell over lexi-host."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
lexi-core = { path = "../lexi-core" }
lexi-host = { path = "../lexi-host" }
lexi-cli = { package = "lexi-cli-rs", path = "../lexi-cli-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = "0.22"
shlex = "1"
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = "3"
